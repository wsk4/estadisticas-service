apiVersion: apps/v1
kind: Deployment
metadata:
  name: estadisticas-service
  labels:
    app: estadisticas-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estadisticas-service
  template:
    metadata:
      labels:
        app: estadisticas-service
    spec:
      containers:
        - name: estadisticas-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/estadisticas-service:latest
          ports:
            - containerPort: 8006

          # ── Variables de entorno desde Secret (sin credenciales en texto plano) ──
          env:
            - name: PORT
              value: "8006"
            - name: CORS_ORIGIN
              value: "http://localhost:4200"
            - name: READY_MAX_MEM_PERCENT
              value: "90"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_NAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: JWT_SECRET

          # ── Recursos (obligatorios para que el HPA funcione) ──────────────────
          resources:
            requests:
              cpu: "50m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "96Mi"

          # ── Sondas de salud (4.1 + 4.3) ──────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3